<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1F5A3F" />
    <meta name="description" content="BETANGGO — Rencanakan perjalanan Kalimantan Tengah dalam satu percakapan bersama Betang AI." />
    <title>BetangGO — Satu Percakapan, Satu Perjalanan</title>
    
    <!-- Self-contained Fonts: Bricolage Grotesque & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Anti-FOUC Theme Script -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('betanggo_theme') || 'light';
          document.documentElement.setAttribute('data-theme', savedTheme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg)] text-[var(--fg)] antialiased select-none overflow-hidden h-full w-full fixed inset-0">
    <div id="root" class="h-full w-full overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
